services:
  postgres:
    # Multi-arch (amd64 + arm64) PostGIS build; same image as the Testcontainers setup.
    image: 'imresamu/postgis:17-3.5'
    environment:
      - 'POSTGRES_DB=hotelagent'
      - 'POSTGRES_USER=hotelagent'
      - 'POSTGRES_PASSWORD=hotelagent'
    ports:
      - '5432'
    labels:
      org.springframework.boot.service-connection: postgres
