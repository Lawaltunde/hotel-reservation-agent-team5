spring.application.name=hotel-reservation-agent
server.port=8080

# Local secrets: the root .env (run from backend/) or ./.env (run from the root). Never committed.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.threads.virtual.enabled=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

# Allowed browser origin(s) for /api/** (comma-separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# POST /api/tasks/prompt: time from submission until the report email must be sent
# This is also the hard overall timeout: just before it, calling stops and the best result so far is emailed.
app.intake.default-deadline=${APP_INTAKE_DEFAULT_DEADLINE:PT10M}
# Concurrent calls per task; keep within the ElevenLabs plan's concurrency limit.
hotel-agent.policy.max-parallel-calls=${HOTEL_AGENT_MAX_PARALLEL_CALLS:3}

# ---------- Report email ----------
# Subject of the one report email (the organizer's exact wording is not yet confirmed).
app.report.subject=${APP_REPORT_SUBJECT:Team 5 - Hotel Reservation Enquiry Result}
# Link to a call in the ElevenLabs dashboard (path not verified; check one in the dashboard).
app.report.conversation-url-template=${APP_REPORT_CONVERSATION_URL_TEMPLATE:https://elevenlabs.io/app/conversational-ai/history/{conversationId}}
# Copied (CC) on every report; the request's own email address is always the recipient. Empty = no copy.
app.report.recipient=${REPORT_RECIPIENT:}
# Public URL of this backend, e.g. https://agent.example.com. Without it the report has no recording link.
app.public-base-url=${APP_PUBLIC_BASE_URL:}
app.report.recording-link-ttl=${APP_REPORT_RECORDING_LINK_TTL:P30D}

# ---------- Spring AI (OpenAI) : prompt intake and offer extraction from call transcripts ----------
# "not-set" lets the app start without a key; extraction then fails with a clear error.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
# gpt-5.4-mini: current cost-efficient GPT-5.4 tier with Structured Outputs on Chat Completions.
# Reasoning effort "none" keeps latency/cost low and permits sampling parameters such as temperature.
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5.4-mini}
spring.ai.openai.chat.reasoning-effort=${OPENAI_REASONING_EFFORT:none}
spring.ai.openai.chat.temperature=${OPENAI_TEMPERATURE:0.1}

# ---------- Providers (all disabled by default: logging / no-op stubs are used) ----------
hotel-agent.elevenlabs.enabled=${ELEVENLABS_ENABLED:false}
hotel-agent.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
hotel-agent.elevenlabs.agent-id=${ELEVENLABS_AGENT_ID:}
hotel-agent.elevenlabs.agent-phone-number-id=${ELEVENLABS_AGENT_PHONE_NUMBER_ID:}
hotel-agent.elevenlabs.webhook-secret=${ELEVENLABS_WEBHOOK_SECRET:}

hotel-agent.google-places.enabled=${GOOGLE_PLACES_ENABLED:false}
hotel-agent.google-places.api-key=${GOOGLE_PLACES_API_KEY:}

hotel-agent.resend.enabled=${RESEND_ENABLED:false}
hotel-agent.resend.api-key=${RESEND_API_KEY:}
hotel-agent.resend.from=${RESEND_FROM:}
hotel-agent.resend.webhook-secret=${RESEND_WEBHOOK_SECRET:}

# Twilio (not called directly yet; ElevenLabs places calls through its native Twilio integration)
hotel-agent.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
hotel-agent.twilio.api-key-sid=${TWILIO_API_KEY_SID:}
hotel-agent.twilio.api-key-secret=${TWILIO_API_KEY_SECRET:}
hotel-agent.twilio.phone-number=${TWILIO_PHONE_NUMBER:}
