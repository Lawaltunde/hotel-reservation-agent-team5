name: CI

on:
  push:
    branches: [main, backend, frontend, test]
  pull_request:
    branches: [main, backend, frontend, test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Root reactor build: the frontend module builds the Next.js export (Node is downloaded by
    # frontend-maven-plugin) and the backend packages it, so this job proves the single jar works.
    name: Full build (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit/slice tests (*Test) run in surefire; integration tests (*IT) run in
      # failsafe against Testcontainers (Docker is preinstalled on ubuntu-latest).
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # hashFiles() needs the checked-out workspace, so it cannot gate the job
      # itself; each step is gated instead. The job is a no-op until frontend/ exists.
      - name: Set up Node 22
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run typecheck

      # Vitest: models, services and components in jsdom.
      - name: Unit tests
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm test

      - name: Build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build

  e2e:
    # Builds the single jar and drives it with Playwright, against a real PostGIS service.
    # Builds its own jar (tests skipped) so it runs in parallel with the full build.
    name: E2E (Playwright vs packaged jar)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_DB: hotelagent
          POSTGRES_USER: hotelagent
          POSTGRES_PASSWORD: hotelagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotelagent -d hotelagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package jar (UI + API)
        run: ./mvnw -B -DskipTests package

      # The chat specs need the prompt reader; this mock answers it by keyword (no real model).
      # Node is preinstalled on ubuntu-latest; the script has no dependencies.
      - name: Start mock OpenAI
        run: |
          nohup node e2e/support/mock-openai.mjs > mock-openai.log 2>&1 &
          echo $! > mock-openai.pid

      - name: Start app
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hotelagent
          SPRING_DATASOURCE_USERNAME: hotelagent
          SPRING_DATASOURCE_PASSWORD: hotelagent
          SPRING_DOCKER_COMPOSE_ENABLED: 'false'
          # Never reach a real provider from CI, whatever a .env or repo variable says.
          ELEVENLABS_ENABLED: 'false'
          GOOGLE_PLACES_ENABLED: 'false'
          RESEND_ENABLED: 'false'
          HOTEL_AGENT_ELEVENLABS_ENABLED: 'false'
          HOTEL_AGENT_GOOGLEPLACES_ENABLED: 'false'
          HOTEL_AGENT_RESEND_ENABLED: 'false'
          OPENAI_API_KEY: not-set
          SPRING_AI_OPENAI_BASE_URL: http://localhost:4010/v1
          SPRING_AI_OPENAI_API_KEY: sk-e2e-mock
        run: |
          JAR=""
          for f in backend/target/hotel-reservation-agent-*.jar; do
            case "$f" in *-plain.jar) ;; *) JAR="$f" ;; esac
          done
          [ -n "$JAR" ] || { echo "No jar in backend/target"; exit 1; }
          echo "Starting $JAR"
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "App is UP after ~$((i * 2))s"; exit 0
            fi
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              echo "App process exited"; cat app.log; exit 1
            fi
            sleep 2
          done
          echo "App did not become healthy in 120s"; tail -n 200 app.log; exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Typecheck specs
        working-directory: e2e
        run: npm run typecheck

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" 2>/dev/null || true; fi
          if [ -f mock-openai.pid ]; then kill "$(cat mock-openai.pid)" 2>/dev/null || true; fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            app.log
            mock-openai.log
          retention-days: 14
          if-no-files-found: ignore
